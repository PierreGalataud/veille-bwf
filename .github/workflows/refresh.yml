name: Rafraîchir les données

on:
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6 h (UTC). Mettez "*/30 * * * *" les jours de tournoi.

permissions:
  contents: write           # autorise le robot à committer data.json

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15     # le collecteur espace ses requêtes ; un blocage réseau ne doit pas consommer des heures de runner
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Tests du collecteur
        run: mvn -q -B -f collector/pom.xml test

      - name: Lancer le collecteur (écrit public/data.json)
        # Filet LLM (étape A) : la clé vient des secrets GitHub Actions, jamais
        # du code ni de Vercel. Secret absent → filet inerte, pipeline identique.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          mvn -q -B -f collector/pom.xml compile exec:java
          -Dexec.args="${{ github.workspace }}/public/data.json"

      # Mécanisation du garde-fou « vérifier que data.json reste conforme au
      # schéma » (CLAUDE.md) : un data.json invalide ne doit JAMAIS être committé.
      - name: Valider data.json (contrat minimal)
        run: |
          jq -e '
            (.generatedAt | type == "string") and
            (.weekLabel   | type == "string") and
            (.current     | type == "array") and
            (.players     | type == "array") and
            (.upcoming    | type == "array") and
            ([.current[].tier]  | all(IN("wtf","1000","750","500","300"))) and
            ([.upcoming[].tier] | all(IN("wtf","1000","750","500","300"))) and
            ([.current[].frenchStatus.present] | all(. == true or . == false or . == null))
          ' public/data.json > /dev/null

      - name: Committer si data.json a changé
        run: |
          git config user.name "veille-bot"
          git config user.email "actions@users.noreply.github.com"
          # llm-cache.json : verdicts Haiku persistés (un titre déjà vu ne
          # redéclenche jamais d'appel — zéro token inutile, data.json stable).
          # Le fichier n'existe qu'après un premier cas incertain, d'où le test.
          git add public/data.json
          if [ -f collector/llm-cache.json ]; then git add collector/llm-cache.json; fi
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +%FT%TZ)"
          # Un commit a pu arriver sur main entre le checkout et ce push (modif
          # manuelle, autre run) : on rebase notre éventuel commit data avant de pousser.
          git pull --rebase origin main
          git push
