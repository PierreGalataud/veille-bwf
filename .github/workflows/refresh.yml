name: Rafraîchir les données

on:
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6 h (UTC). Mettez "*/30 * * * *" les jours de tournoi.

permissions:
  contents: write           # autorise le robot à committer data.json

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Lancer le collecteur (écrit public/data.json)
        run: >
          mvn -q -B -f collector/pom.xml compile exec:java
          -Dexec.args="${{ github.workspace }}/public/data.json"

      - name: Committer si data.json a changé
        run: |
          git config user.name "veille-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data.json
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +%FT%TZ)"
          git push
